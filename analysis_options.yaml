# offline_document_viewer — static analysis.
#
# A published package lives or dies by its public surface, so the rules here
# are strict and non-negotiable. `public_member_api_docs` is what earns the
# pub.dev documentation points — and, more importantly, what makes the package
# usable without reading its source.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # An analyzer hint is a defect. CI runs with --fatal-infos.
    todo: warning
    unused_import: error
    unused_local_variable: error
    dead_code: error
    # No swallowed errors: every catch must produce a DocumentFailure.
    empty_catches: error

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"

linter:
  rules:
    # — contract clarity —
    public_member_api_docs: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unnecessary_lambdas: true
    use_super_parameters: true

    # — performance —
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # — diff noise —
    require_trailing_commas: true
    directives_ordering: true
    sort_pub_dependencies: true

    # `avoid_redundant_argument_values` is deliberately OFF: the WebView
    # security flags (`allowFileAccessFromFileURLs: false` and friends) are
    # written out explicitly. Deleting them because they match today's default
    # would hide the security posture and silently lose it if an upstream
    # default ever changes.

    # — safety and correctness —
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true
    unawaited_futures: true
    use_build_context_synchronously: true
